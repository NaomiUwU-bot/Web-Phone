<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký</title>
    <link rel="stylesheet" href="SU.css">
    <link rel="stylesheet" href="../Components/Header.css">
    <link rel="stylesheet" href="../Components/Footer.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<body>
    <header id="header"></header>
    <div class="signup-container">
        <div class="backround">
            <div class="lớp-mờ"></div>
            <div class="container">
                
                <!-- Tiêu đề -->
                <div class="tieu-de">
                    <h2>Đăng ký tài khoản</h2>
                    <p>
                        Tạo tài khoản để mua sắm nhanh chóng,
                        quản lý đơn hàng và nhận nhiều ưu đãi hấp dẫn
                    </p>
                </div>

            <form action="#" method="post">
            <!-- THÔNG TIN CÁ NHÂN -->
            <div class="phần">
                <h3>Thông tin cá nhân</h3>
                <!-- Hàng 1 -->
                <div class="hàng">
                    <div class="nhập">
                        <label>Họ và tên</label>
                        <input type="  text" 
                        name="fullname" 
                        placeholder="Nhập họ và Tên" 
                        autocomplete="name" 
                        required>
                        <small class="error"></small>
                    </div>
                    <div class="nhập">
                        <label>Ngày sinh</label>
                        <input 
                        type="date" 
                        name="ngaysinh" 
                        autocomplete="ngaysinh" 
                        required>
                        <small class="error"></small>
                    </div>
                </div>        

                <!-- Hàng 2 -->
                <div class="hàng">
                    <div class="nhập">
                        <label>Số điện thoại</label>
                        <input 
                        type="tel" 
                        name="phone" 
                        placeholder="Nhập số điện thoại" 
                        autocomplete="tel" 
                        required>
                        <small class="error"></small>
                    </div>
                    <div class="nhập">
                        <label>Email</label>
                        <input 
                        type="email" 
                        name="email" 
                        placeholder="Nhập email" 
                        autocomplete="email" 
                        required>
                        <small class="error"></small>
                    </div>
                </div>
            </div>

            <!-- TẠO MẬT KHẨU -->
            <div class="phần">
                <h3>Tạo mật khẩu</h3>
                <!-- Hàng 3 -->
                <div class="hàng">
                    <div class="nhập password-box">
                        <label>Mật khẩu</label>
                        <input 
                        id="password" 
                        type="password" 
                        name="password" 
                        placeholder="Nhập mật khẩu" 
                        autocomplete="new-password" 
                        required>
                        <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                        <small class="error"></small>
                    </div>
                    <div class="nhập password-box">
                        <label>Nhập lại mật khẩu</label>
                        <input 
                        id="confirm_password" 
                        type="password" 
                        name="confirm_password" 
                        placeholder="Nhập lại mật khẩu" 
                        autocomplete="new-password" 
                        required>
                        <i class="fa-solid fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
                        <small class="error"></small>
                    </div>
                </div>  
            </div>
                <!-- Điều khoản -->
                <div class="check">
                    <label>
                        <input type="checkbox" 
                        name="agree" 
                        required>
                        Tôi đồng ý với điều kiện
                    </label>
                </div>

                <!-- Nút -->
                <button type="submit" 
                class="btn" 
                name="btn">
                Đăng ký
                </button>


                <div class="link">
                    <p>
                    Đã có tài khoản?  
                    <a href="LI.html">
                        Đăng nhập ngay
                    </a>
                    </p>
                </div>

            </form>
            </div>
        </div>
    </div>
    <script src="storage.js"></script>
    <script src="SU.js"></script>
</body>
</html>
