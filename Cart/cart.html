<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Cart</title>
	<link rel="stylesheet" href="cart.css">
	<link rel="stylesheet" href="../Components/Header.css">
	<link rel="stylesheet" href="../Components/Footer.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
	<header id="header"></header>

	<main class="cart">
		<section id="cart-actions">
			<label>
                <input type="checkbox" id="select-all-checkbox" class="cart-item__checkbox">
                <span>Chọn tất cả</span>
            </label>
            <label>
            	<button id="delete-all-btn" aria-label="Xóa tất cả">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
			    </button>
			    <span>Xóa tất cả</span>
            </label>
            
		</section>
		<section class="products-section">
			<div id="product-list" class="products-section__list"></div>
		</section>
		<section id="cart-summary" class="cart-summary">
			<div class="cart-summary__left">
				<label class="cart-summary__label">
					<span id="cart-summary__total">Tạm tính: 0đ</span>
				</label>
			</div>
			<div class="cart-summary__right">
				<button id="cart-summary__checkout-btn" disabled>Mua hàng</button>
			</div>
		</section>
	</main>

	<footer id="footer"></footer>

	<script src="../Auth/authentication.js"></script>
	<script src="cart.js"></script>
</body>
</html>
