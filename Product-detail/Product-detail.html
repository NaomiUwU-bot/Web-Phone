<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Components/Header.css">
    <link rel="stylesheet" href="../Components/Footer.css">
</head>

<body>

    <header id="header"></header>

    <main>
        <section class="detail-container">
            <div class="product-detail">
                <!--ảnh-->
                <div class="detail-image">

                    <div class="main-img">
                        <img id="mainImage" src="img/oppo-a5i-pro.jpg" alt="">
                    </div>

                    <div class="thumbnail-list">
                        <img class="active" src="img/oppo-a5i-pro.jpg">
                        <img src="img/oppo-a5i-pro-1.jpg">
                        <img src="img/oppo-a5i-pro-2.jpg">
                        <img src="img/oppo-a5i-pro-3.jpg">

                    </div>
                </div>

                <!--thông tin-->
                <div class="detail-info">
                    <h1 id="productName">
                        OPPO A5i Pro 8GB/128GB
                    </h1>

                    <div class="rating">
                        <span class="star">
                            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> 4.9
                        </span>
                        <span>|</span>
                        <span>Đã bán 11.2k</span>
                    </div>

                    <div class="price" id="productPrice">
                        6,390,000 VNĐ
                    </div>

                    <div class="description">Máy nổi bật với chip Snapdragon 6s Gen 1, màn hình lớn mượt mà và pin bền
                        bỉ 6000 mAh. Cùng với
                        camera 50 MP sắc nét và thiết kế tinh tế, OPPO A5i Pro mang đến trải nghiệm trọn vẹn cả công
                        nghệ lẫn thẩm mỹ.
                    </div>

                    <div class="select-box">
                        <h3>Dung lượng: </h3>
                        <div class="storage-list">
                            <button class="storage active" data-price="6390000">64GB</button>
                            <button class="storage" data-price="6990000">128GB</button>
                            <button class="storage" data-price="7690000">256GB</button>

                        </div>
                    </div>

                    <div class="select-box">
                        <h3>Chọn màu</h3>
                        <div class="color-list">
                            <button class="color active">Đen </button>
                            <button class="color"> Trắng </button>
                            <button class="color"> Xanh </button>

                        </div>

                    </div>

                    <div class="button-group">
                        <button id="addCart">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ hàng
                        </button>
                        <button id="buyNow"> Mua ngay </button>

                    </div>

                </div>

            </div>

        </section>




    </main>

    <footer id="footer"></footer>
    <script src="detail.js"></script>
</body>

</html>
