<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Components/Header.css">
    <link rel="stylesheet" href="../Components/Footer.css">
</head>

<body>

    <header id="header"></header>

    <main>
        <section class="detail-container">

            <div class="product-detail">
                <!--ảnh (cột trái)-->
                <div class="detail-image">
                    <div class="main-img">
                        <img id="mainImage" src="../img/Ảnh sản phẩm/iphone-17e-pink.jpg" alt="">
                    </div>
                    <div class="thumbnail-list">
                        <img class="active" src="../img/Ảnh sản phẩm/iphone-17e-pink.jpg">
                        <img src="../img/Ảnh sản phẩm/iphone-17e-pink-1.jpg">
                        <img src="../img/Ảnh sản phẩm/iphone-17e-pink-2.jpg">
                        <img src="../img/Ảnh sản phẩm/iphone-17e-pink-3.jpg">

                    </div>
                </div>

                <!--thông tin (cột phải)-->
                <div class="detail-info">
                    <h1 id="productName">
                        iPhone 17e 256GB
                    </h1>

                    <div class="rating">
                        <span class="star">
                            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> 4.9
                        </span>
                        <span>|</span>
                        <span> Đã bán 2.7k</span>
                    </div>

                    <div class="price" id="productPrice">
                        17.590.000 VNĐ
                    </div>

                    <div class="description">iPhone 17e 256GB là phiên bản có dung lượng lưu trữ lớn, hiệu năng mạnh mẽ
                        với chip A19, màn hình Super Retina XDR 6,1 inch, camera 48MP Fusion và thời lượng pin dài, hỗ
                        trợ 5G và MagSafe.
                    </div>


                    <div class="option">

                        <div class="select-box">
                            <h3>Dung lượng: </h3>
                            <div class="storage-list">
                                <button class="storage" data-price="15890000">128GB</button>
                                <button class="storage active" data-price="17590000">256GB</button>
                                <button class="storage" data-price="19990000">512GB</button>

                            </div>
                        </div>

                        <div class="select-box">
                            <h3>Chọn màu</h3>
                            <div class="color-list">
                                <button class="color active"> Đen </button>
                                <button class="color"> Xanh </button>
                                <button class="color"> Hồng Phai </button>

                            </div>
                        </div>

                    </div>

                    <div class="button-group">
                        <button id="addCart">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ hàng
                        </button>
                        <button id="buyNow"> Mua ngay </button>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <footer id="footer"></footer>
    <script src="detail.js"></script>
</body>

</html>
