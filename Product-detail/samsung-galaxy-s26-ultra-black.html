<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../Components/Header.css">
    <link rel="stylesheet" href="../Components/Footer.css">
</head>

<body>

    <header id="header"></header>

    <main>
        <section class="detail-container">

            <div class="product-detail">
                <!--ảnh (cột trái)-->
                <div class="detail-image">
                    <div class="main-img">
                        <img id="mainImage" src="../img/Ảnh sản phẩm/samsung-galaxy-s26-ultra-black.jpg" alt="">
                    </div>
                    <div class="thumbnail-list">
                        <img class="active" src="../img/Ảnh sản phẩm/samsung-galaxy-s26-ultra-black.jpg">
                        <img src="../img/Ảnh sản phẩm/samsung-galaxy-s26-ultra-black-1.jpg">
                        <img src="../img/Ảnh sản phẩm/samsung-galaxy-s26-ultra-black-2.jpg">
                        <img src="../img/Ảnh sản phẩm/samsung-galaxy-s26-ultra-black-3.jpg">

                    </div>
                </div>

                <!--thông tin (cột phải)-->
                <div class="detail-info">
                    <h1 id="productName">
                        Samsung Galaxy S26 Ultra 5G 12GB/256GB
                    </h1>

                    <div class="rating">
                        <span class="star">
                            <i class="fa-solid fa-star" style="color: rgb(255, 212, 59);"></i> 4.9
                        </span>
                        <span>|</span>
                        <span> Đã bán 15.2k</span>
                    </div>

                    <div class="price" id="productPrice">
                        31.480.000 VNĐ
                    </div>

                    <div class="description">Samsung Galaxy S26 Ultra 5G nổi bật với màn hình Dynamic AMOLED 2X sắc nét,
                        hiệu năng mạnh mẽ từ vi xử lý Snapdragon 8 Elite for Galaxy và hệ thống camera cao cấp cho chất
                        lượng ảnh ấn tượng.
                    </div>


                    <div class="option">

                        <div class="select-box">
                            <h3>Dung lượng: </h3>
                            <div class="storage-list">
                                <button class="storage" data-price="25390000">128GB</button>
                                <button class="storage active" data-price="31480000">256GB</button>
                                <button class="storage" data-price="38990000">512GB</button>

                            </div>
                        </div>

                        <div class="select-box">
                            <h3>Chọn màu</h3>
                            <div class="color-list">
                                <button class="color active">Đen </button>
                                <button class="color"> Tím </button>
                                <button class="color"> Hồng </button>

                            </div>
                        </div>

                    </div>

                    <div class="button-group">
                        <button id="addCart">
                            <i class="fa-solid fa-cart-plus"></i> Thêm vào giỏ hàng
                        </button>
                        <button id="buyNow"> Mua ngay </button>
                    </div>

                </div>

            </div>
        </section>

    </main>

    <footer id="footer"></footer>
    <script src="detail.js"></script>
</body>

</html>
